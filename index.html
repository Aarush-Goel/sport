<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Shop Animated</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
    margin:0;
}

/* Header animation */
header {
    background:#1e293b;
    padding:15px;
    display:flex;
    justify-content:space-between;
    animation: slideDown 0.6s ease;
}

@keyframes slideDown {
    from {transform:translateY(-100%);}
    to {transform:translateY(0);}
}

/* Buttons */
button {
    background:#22c55e;
    border:none;
    padding:8px;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}
button:hover {transform:scale(1.1);}
button:active {transform:scale(0.9);}

/* Products */
.products {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.card {
    background:#1e293b;
    margin:15px;
    padding:15px;
    border-radius:15px;
    width:200px;
    text-align:center;
    animation: fadeInUp 0.6s ease;
    transition:0.3s;
}

.card:hover {
    transform:translateY(-10px) scale(1.05);
}

@keyframes fadeInUp {
    from {opacity:0; transform:translateY(40px);}
    to {opacity:1; transform:translateY(0);}
}

.card img {
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

/* Sections */
.section {padding:20px;}
.hidden {display:none;}

/* Flash message */
.flash {
    position:fixed;
    top:20px;
    right:20px;
    background:#22c55e;
    padding:10px;
    border-radius:10px;
    animation:fadeOut 2s forwards;
}

@keyframes fadeOut {
    0%{opacity:1;}
    100%{opacity:0; transform:translateY(-20px);}
}
</style>

</head>
<body>

<header>
<h2>🏏 Sports Shop</h2>
<div>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cart')">Cart (<span id="count">0</span>)</button>
<button onclick="show('orders')">Orders</button>
</div>
</header>

<div id="shop" class="products">
<div class="card">
<img src="https://images.unsplash.com/photo-1517649763962-0c623066013b">
<h3>Football</h3>
<p>₹800</p>
<button onclick="addToCart('Football',800)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1593341646782-e0b495cff86d">
<h3>Cricket Bat</h3>
<p>₹1500</p>
<button onclick="addToCart('Cricket Bat',1500)">Add</button>
</div>
</div>

<div id="cart" class="section hidden">
<h2>Cart</h2>
<ul id="cartItems"></ul>
<p>Total: ₹<span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>
</div>

<div id="orders" class="section hidden">
<h2>Orders</h2>
<ul id="orderList"></ul>
</div>

<script>
let cart=[];
let orders=JSON.parse(localStorage.getItem("orders"))||[];

function show(page){
document.getElementById("shop").classList.add("hidden");
document.getElementById("cart").classList.add("hidden");
document.getElementById("orders").classList.add("hidden");
document.getElementById(page).classList.remove("hidden");
}

function flash(msg){
let d=document.createElement("div");
d.className="flash";
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
}

function addToCart(name,price){
cart.push({name,price});
updateCart();
flash("Added to cart");
}

function updateCart(){
let list=document.getElementById("cartItems");
list.innerHTML="";
let total=0;

cart.forEach(item=>{
let li=document.createElement("li");
li.innerText=item.name+" - ₹"+item.price;
list.appendChild(li);
total+=item.price;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

function checkout(){
orders.push({items:cart,date:new Date().toLocaleString()});
localStorage.setItem("orders",JSON.stringify(orders));
cart=[];
updateCart();
flash("Order placed!");
loadOrders();
}

function loadOrders(){
let list=document.getElementById("orderList");
list.innerHTML="";
orders.forEach(o=>{
let li=document.createElement("li");
li.innerText=o.date+" - "+o.items.map(i=>i.name).join(",");
list.appendChild(li);
});
}

loadOrders();
updateCart();
</script>

</body>
</html>
